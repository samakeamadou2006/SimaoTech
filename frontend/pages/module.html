<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Module | SimaoTech</title>
  <meta name="theme-color" content="#1155cc" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="menu-lateral" id="menu-lateral"></aside>
    <div class="voile" id="voile-menu"></div>
    <div class="contenu">
      <header class="barre-haut">
        <div class="d-flex align-items-center gap-3">
          <button type="button" class="bouton-menu" id="bouton-menu" aria-label="Ouvrir le menu">☰</button>
          <div><p class="barre-haut__titre" id="titre-module">Module</p><p class="texte-petit texte-doux mb-0" id="role-utilisateur">-</p></div>
        </div>
        <div class="barre-haut__actions">
          <span class="pastille" id="pastille-reseau">Verification...</span>
          <div id="zone-utilisateur"></div>
          <button type="button" class="btn btn-st-contour btn-sm" id="bouton-deconnexion">Deconnexion</button>
        </div>
      </header>
      <main class="zone">
        <div id="message-module" class="message" hidden></div>
        <section class="bloc">
          <div class="bloc__entete bloc__entete--outils">
            <div><h2 class="bloc__titre" id="titre-bloc">-</h2><p class="texte-petit texte-doux mb-0" id="description-module">-</p></div>
            <button type="button" class="btn btn-st btn-sm" id="bouton-nouveau">Nouvelle operation</button>
          </div>
          <div class="bloc__corps p-0">
            <div class="table-responsive"><table class="tableau"><thead id="entete-tableau"></thead><tbody id="corps-module"><tr><td class="vide">Chargement...</td></tr></tbody></table></div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <div class="modal fade" id="modal-module" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content">
      <form id="formulaire-module">
        <div class="modal-header"><h2 class="modal-title fs-5" id="titre-modal">Nouvelle operation</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div id="message-formulaire" class="message" hidden></div>
          <div id="champs-module"></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-st-contour" data-bs-dismiss="modal">Annuler</button><button type="submit" class="btn btn-st">Enregistrer</button></div>
      </form>
    </div></div>
  </div>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/metiers.js"></script>
  <script type="module" src="/js/pwa.js"></script>
</body>
</html>
